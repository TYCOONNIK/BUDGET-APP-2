<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Household Ledger</title>
<meta name="theme-color" content="#24312B" />
<meta name="description" content="A simple weekly budgeting ledger — recurring bills, multiple paychecks, a wish list, and month/year totals." />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<meta name="mobile-web-app-capable" content="yes" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #E7E9E1;
    min-height: 100vh;
  }
  body {
    padding: 20px 12px 40px;
  }
  #root { display: flex; justify-content: center; }

  .ledgerRoot {
    --paper: #E7E9E1;
    --card: #F2F3EE;
    --ink: #24312B;
    --ink-soft: #66756C;
    --rule: #BFC6B8;
    --accent: #C98A2C;
    --positive: #3F6C51;
    --negative: #A6402D;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(36,49,43,0.12);
  }
  .perf { display: flex; justify-content: space-evenly; padding: 8px 10px 0; background: var(--paper); }
  .perf span { width: 6px; height: 6px; border-radius: 50%; background: var(--card); box-shadow: inset 0 1px 1px rgba(36,49,43,0.25); }
  .head { padding: 10px 22px 14px; text-align: center; }
  .eyebrow { font-size: 11px; letter-spacing: 0.14em; color: var(--ink-soft); font-weight: 500; }
  .head h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 26px; margin: 2px 0 0; }
  .weekbar, .yearbar { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 16px 12px; }
  .weekbar > button, .yearbar > button { background: none; border: none; font-size: 20px; color: var(--ink); cursor: pointer; line-height: 1; padding: 4px 8px; }
  .weeklabel { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .tab { background: var(--accent); color: #fff; font-weight: 600; font-size: 13.5px; padding: 6px 16px 5px; border-radius: 8px 8px 3px 3px; letter-spacing: 0.01em; }
  .yearTab { min-width: 56px; text-align: center; }
  .today { border: none; background: none; color: var(--ink-soft); text-decoration: underline; font-size: 11.5px; cursor: pointer; padding: 0; }
  .card { background: var(--card); margin: 0 12px; border-radius: 8px; padding: 16px 16px 8px; }
  .sectionLabel { font-size: 10.5px; letter-spacing: 0.12em; color: var(--ink-soft); font-weight: 600; margin-bottom: 2px; }
  .row { display: flex; align-items: baseline; gap: 8px; padding: 7px 0; }
  .row label, .row .name { flex-shrink: 0; font-size: 14.5px; }
  .name { border: none; background: none; font-family: 'IBM Plex Sans', sans-serif; font-size: 14.5px; color: var(--ink); min-width: 0; flex-shrink: 1; padding: 2px 0; }
  span.name { flex-shrink: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name:focus, .amount:focus, input:focus { outline: none; }
  .leader { flex: 1; border-bottom: 2px dotted var(--rule); position: relative; top: -4px; min-width: 10px; }
  .amount { flex-shrink: 0; width: 78px; text-align: right; font-family: 'IBM Plex Mono', monospace; font-size: 14.5px; border: none; background: none; color: var(--ink); }
  .income .amount, .income .name { font-weight: 600; }
  .del { border: none; background: none; color: var(--ink-soft); font-size: 17px; cursor: pointer; padding: 0 0 0 2px; line-height: 1; }
  .rule { height: 1px; background: var(--rule); margin: 8px 0 4px; }
  .items { margin-bottom: 2px; }
  .add { display: block; width: 100%; margin: 6px 0 14px; padding: 8px; border: 1px dashed var(--rule); border-radius: 6px; background: none; color: var(--ink-soft); font-size: 13px; cursor: pointer; }
  .add.small { width: auto; display: inline-block; margin: 2px 0 4px; padding: 5px 10px; font-size: 12px; }
  .totals { border-top: 3px double var(--ink); padding-top: 6px; margin-top: 2px; }
  .total-row { font-size: 14px; color: var(--ink-soft); }
  .leftover-row { font-weight: 600; font-size: 15px; padding-bottom: 12px; }
  .leftover-row .big { font-size: 18px; }
  .leftover-row.pos .mono { color: var(--positive); }
  .leftover-row.neg .mono { color: var(--negative); }
  .mono { font-family: 'IBM Plex Mono', monospace; margin-left: auto; }
  .total-row span:last-child, .leftover-row span:last-child { margin-left: auto; }
  .toggleBar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; margin: 14px 16px 4px; }
  .manageToggle { background: none; border: none; color: var(--ink-soft); text-decoration: underline; font-size: 12.5px; cursor: pointer; padding: 0; }
  .manage { margin: 4px 12px 18px; background: var(--card); border-radius: 8px; padding: 12px 16px 14px; }
  .hint { font-size: 12px; color: var(--ink-soft); margin: 0 0 8px; }
  .manageRow input { flex: 1; border: none; border-bottom: 1px solid var(--rule); background: none; font-size: 14px; padding: 4px 0; color: var(--ink); }
  .manageRow input:focus { border-bottom-color: var(--accent); }
  .addRow { gap: 8px; }
  .addSmall { border: none; background: var(--accent); color: #fff; border-radius: 5px; padding: 5px 10px; font-size: 12px; cursor: pointer; flex-shrink: 0; }
  .wishRow { gap: 6px; }
  .wishAmountInput { width: 64px; border: none; border-bottom: 1px solid var(--rule); background: none; font-family: 'IBM Plex Mono', monospace; font-size: 13px; text-align: right; padding: 4px 0; color: var(--ink); }
  .wishAmountInput:focus { border-bottom-color: var(--accent); }
  .tabSwitch { display: flex; gap: 4px; margin-bottom: 10px; background: var(--paper); border-radius: 6px; padding: 3px; width: fit-content; }
  .tabSwitch button { border: none; background: none; padding: 5px 14px; font-size: 12.5px; border-radius: 4px; cursor: pointer; color: var(--ink-soft); }
  .tabSwitch button.active { background: var(--accent); color: #fff; font-weight: 600; }
  .yearList { margin-bottom: 6px; }
  .yearRow .name { font-size: 14px; }
  .error { margin: 0 12px 16px; background: #F4E3DF; color: var(--negative); font-size: 12.5px; padding: 8px 12px; border-radius: 6px; }
  .recurringCard { background: var(--paper); border-radius: 7px; padding: 8px 10px 6px; margin-bottom: 8px; }
  .recurringCard .row { padding: 3px 0; }
  .recurringMeta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); padding: 4px 0 2px; flex-wrap: wrap; }
  .intervalInput { width: 40px; border: none; border-bottom: 1px solid var(--rule); background: none; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; text-align: center; padding: 2px 0; color: var(--ink); }
  .intervalInput:focus { border-bottom-color: var(--accent); }
  .newRecurringBox { border-top: 1px dashed var(--rule); margin-top: 4px; padding-top: 10px; }
  .footerNote { text-align: center; font-size: 11px; color: var(--ink-soft); margin-top: 14px; padding: 0 20px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useCallback } = React;

// ---- local, on-device storage (mirrors the get/set/delete/list shape) ----
const storage = {
  async get(key) {
    const raw = localStorage.getItem(key);
    if (raw === null) throw new Error("not found");
    return { key, value: raw };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    const existed = localStorage.getItem(key) !== null;
    localStorage.removeItem(key);
    return { key, deleted: existed };
  },
  async list(prefix = "") {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(prefix)) keys.push(k);
    }
    return { keys, prefix };
  },
};

const DEFAULT_RECURRING = [
  { id: "t-mortgage", name: "Mortgage", amount: 0, interval: 1, anchor: null },
  { id: "t-car", name: "Car", amount: 0, interval: 1, anchor: null },
  { id: "t-cc", name: "Credit Card", amount: 0, interval: 1, anchor: null },
];

function pad(n) { return String(n).padStart(2, "0"); }
function toKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function parseKey(k) { return new Date(k + "T00:00:00"); }
function getMonday(d) {
  const date = new Date(d);
  date.setHours(0, 0, 0, 0);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  return date;
}
function addDays(d, n) { const date = new Date(d); date.setDate(date.getDate() + n); return date; }
function diffWeeks(anchorKey, monday) {
  const anchor = getMonday(parseKey(anchorKey));
  return Math.round((monday - anchor) / (7 * 24 * 3600 * 1000));
}
function formatRange(monday) {
  const sunday = addDays(monday, 6);
  const sameMonth = monday.getMonth() === sunday.getMonth();
  const startStr = monday.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const endStr = sunday.toLocaleDateString("en-US", { month: sameMonth ? undefined : "short", day: "numeric", year: "numeric" });
  return `${startStr} – ${endStr}`;
}
function newId() { return `i-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`; }
function money(n) { const v = Number.isFinite(n) ? n : 0; return v.toLocaleString("en-US", { style: "currency", currency: "USD" }); }
function normalizeIncomes(data) {
  if (Array.isArray(data.incomes) && data.incomes.length) return data.incomes;
  if (typeof data.income === "number") return [{ id: newId(), label: "Paycheck", amount: data.income }];
  return [{ id: newId(), label: "Paycheck", amount: 0 }];
}
function normalizeRecurring(list, fallbackAnchor) {
  return (list || []).map((it) => ({
    id: it.id,
    name: it.name || "",
    amount: Number(it.amount) || 0,
    interval: Math.max(1, parseInt(it.interval, 10) || 1),
    anchor: it.anchor || fallbackAnchor,
  }));
}
function sumAmounts(list) { return list.reduce((s, x) => s + (Number(x.amount) || 0), 0); }

function WeeklyLedger() {
  const [recurring, setRecurring] = useState(null);
  const [monday, setMonday] = useState(getMonday(new Date()));
  const [week, setWeek] = useState(null);
  const [ready, setReady] = useState(false);
  const [showRecurring, setShowRecurring] = useState(false);
  const [newRecName, setNewRecName] = useState("");
  const [newRecAmount, setNewRecAmount] = useState("");
  const [newRecInterval, setNewRecInterval] = useState("1");
  const [error, setError] = useState("");

  const [wishlist, setWishlist] = useState(null);
  const [showWishlist, setShowWishlist] = useState(false);
  const [newWishName, setNewWishName] = useState("");
  const [newWishAmount, setNewWishAmount] = useState("");

  const [showTotals, setShowTotals] = useState(false);
  const [totalsTab, setTotalsTab] = useState("month");
  const [monthView, setMonthView] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [yearView, setYearView] = useState(new Date().getFullYear());
  const [monthData, setMonthData] = useState(null);
  const [monthLoading, setMonthLoading] = useState(false);
  const [monthError, setMonthError] = useState("");
  const [yearData, setYearData] = useState(null);
  const [yearLoading, setYearLoading] = useState(false);
  const [yearError, setYearError] = useState("");

  const saveTimer = useRef(null);
  const loadToken = useRef(0);
  const recurringSaveTimer = useRef(null);
  const recurringLoadedRef = useRef(false);
  const wishSaveTimer = useRef(null);
  const wishLoadedRef = useRef(false);

  useEffect(() => {
    (async () => {
      const todayKey = toKey(getMonday(new Date()));
      try {
        let list = DEFAULT_RECURRING;
        try {
          const res = await storage.get("recurring");
          list = JSON.parse(res.value);
        } catch {
          await storage.set("recurring", JSON.stringify(DEFAULT_RECURRING.map((r) => ({ ...r, anchor: todayKey }))));
          list = DEFAULT_RECURRING;
        }
        setRecurring(normalizeRecurring(list, todayKey));
      } catch (e) {
        setError("Couldn't load your saved data. Starting fresh.");
        setRecurring(normalizeRecurring(DEFAULT_RECURRING, todayKey));
      }
    })();
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get("wishlist");
        setWishlist(JSON.parse(res.value));
      } catch {
        setWishlist([]);
      }
    })();
  }, []);

  const loadWeek = useCallback(async (mon, recur) => {
    const key = toKey(mon);
    const token = ++loadToken.current;
    try {
      let data = null;
      try {
        const res = await storage.get(`week:${key}`);
        data = JSON.parse(res.value);
      } catch { data = null; }
      if (!data) {
        let incomes = [{ id: newId(), label: "Paycheck", amount: 0 }];
        try {
          const li = await storage.get("lastIncomes");
          const parsed = JSON.parse(li.value);
          if (Array.isArray(parsed) && parsed.length) {
            incomes = parsed.map((inc) => ({ id: newId(), label: inc.label, amount: inc.amount }));
          }
        } catch {}
        const items = recur
          .filter((r) => {
            const since = diffWeeks(r.anchor, mon);
            return since >= 0 && since % r.interval === 0;
          })
          .map((r) => ({ id: r.id, name: r.name, amount: r.amount }));
        data = { incomes, items };
      } else {
        data = { ...data, incomes: normalizeIncomes(data) };
      }
      if (token === loadToken.current) setWeek(data);
    } catch (e) {
      if (token === loadToken.current) {
        setError("Couldn't load that week.");
        setWeek({ incomes: [{ id: newId(), label: "Paycheck", amount: 0 }], items: [] });
      }
    } finally {
      if (token === loadToken.current) setReady(true);
    }
  }, []);

  useEffect(() => {
    if (!recurring) return;
    setReady(false);
    loadWeek(monday, recurring);
  }, [monday, recurring, loadWeek]);

  useEffect(() => {
    if (!ready || !week) return;
    const key = toKey(monday);
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await storage.set(`week:${key}`, JSON.stringify(week));
        await storage.set("lastIncomes", JSON.stringify(week.incomes.map((inc) => ({ label: inc.label, amount: inc.amount }))));
        setError("");
      } catch { setError("Couldn't save — your last change may not stick."); }
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [week]);

  useEffect(() => {
    if (!recurring) return;
    if (!recurringLoadedRef.current) { recurringLoadedRef.current = true; return; }
    if (recurringSaveTimer.current) clearTimeout(recurringSaveTimer.current);
    recurringSaveTimer.current = setTimeout(async () => {
      try { await storage.set("recurring", JSON.stringify(recurring)); setError(""); }
      catch { setError("Couldn't save your recurring items — try again in a moment."); }
    }, 450);
    return () => clearTimeout(recurringSaveTimer.current);
  }, [recurring]);

  useEffect(() => {
    if (!wishlist) return;
    if (!wishLoadedRef.current) { wishLoadedRef.current = true; return; }
    if (wishSaveTimer.current) clearTimeout(wishSaveTimer.current);
    wishSaveTimer.current = setTimeout(async () => {
      try { await storage.set("wishlist", JSON.stringify(wishlist)); setError(""); }
      catch { setError("Couldn't save your wish list — try again in a moment."); }
    }, 400);
    return () => clearTimeout(wishSaveTimer.current);
  }, [wishlist]);

  const aggregate = useCallback(async (prefix) => {
    const listRes = await storage.list(prefix);
    const keys = listRes.keys || [];
    const catTotals = {};
    let income = 0, spent = 0, weeksCount = 0;
    for (const k of keys) {
      try {
        const res = await storage.get(k);
        const data = JSON.parse(res.value);
        weeksCount += 1;
        income += sumAmounts(normalizeIncomes(data));
        (data.items || []).forEach((it) => {
          const name = (it.name || "").trim() || "Untitled";
          const amt = Number(it.amount) || 0;
          spent += amt;
          catTotals[name] = (catTotals[name] || 0) + amt;
        });
      } catch {}
    }
    const categories = Object.entries(catTotals).map(([name, total]) => ({ name, total })).sort((a, b) => b.total - a.total);
    return { categories, income, spent, leftover: income - spent, weeks: weeksCount };
  }, []);

  useEffect(() => {
    if (!showTotals || totalsTab !== "month") return;
    let cancelled = false;
    (async () => {
      setMonthLoading(true); setMonthError("");
      try {
        const prefix = `week:${monthView.getFullYear()}-${pad(monthView.getMonth() + 1)}-`;
        const summary = await aggregate(prefix);
        if (!cancelled) setMonthData(summary);
      } catch { if (!cancelled) setMonthError("Couldn't load this month's totals."); }
      finally { if (!cancelled) setMonthLoading(false); }
    })();
    return () => { cancelled = true; };
  }, [showTotals, totalsTab, monthView, aggregate]);

  useEffect(() => {
    if (!showTotals || totalsTab !== "year") return;
    let cancelled = false;
    (async () => {
      setYearLoading(true); setYearError("");
      try {
        const summary = await aggregate(`week:${yearView}-`);
        if (!cancelled) setYearData(summary);
      } catch { if (!cancelled) setYearError("Couldn't load this year's totals."); }
      finally { if (!cancelled) setYearLoading(false); }
    })();
    return () => { cancelled = true; };
  }, [showTotals, totalsTab, yearView, aggregate]);

  if (!recurring || !week || !wishlist) {
    return <div className="ledgerRoot"><div style={{ padding: "40px 20px", textAlign: "center", color: "var(--ink-soft)" }}>Opening your ledger…</div></div>;
  }

  const totalIncome = sumAmounts(week.incomes);
  const totalBills = week.items.reduce((s, it) => s + (Number(it.amount) || 0), 0);
  const leftover = totalIncome - totalBills;

  function updateItem(id, patch) { setWeek((w) => ({ ...w, items: w.items.map((it) => (it.id === id ? { ...it, ...patch } : it)) })); }
  function removeItem(id) { setWeek((w) => ({ ...w, items: w.items.filter((it) => it.id !== id) })); }
  function addOneOffItem(prefill) {
    const id = newId();
    const name = prefill ? prefill.name : "";
    const amount = prefill ? Number(prefill.amount) || 0 : 0;
    setWeek((w) => ({ ...w, items: [...w.items, { id, name, amount }] }));
    if (!prefill) setTimeout(() => { const el = document.getElementById(`name-${id}`); if (el) el.focus(); }, 30);
  }
  function updateIncome(id, patch) { setWeek((w) => ({ ...w, incomes: w.incomes.map((inc) => (inc.id === id ? { ...inc, ...patch } : inc)) })); }
  function removeIncome(id) { setWeek((w) => ({ ...w, incomes: w.incomes.filter((inc) => inc.id !== id) })); }
  function addIncomeRow() {
    const id = newId();
    setWeek((w) => ({ ...w, incomes: [...w.incomes, { id, label: "", amount: 0 }] }));
    setTimeout(() => { const el = document.getElementById(`inc-${id}`); if (el) el.focus(); }, 30);
  }

  function addRecurringItem() {
    const name = newRecName.trim();
    if (!name) return;
    const amount = parseFloat(newRecAmount);
    const interval = Math.max(1, parseInt(newRecInterval, 10) || 1);
    const anchor = toKey(monday);
    const id = newId();
    const item = { id, name, amount: Number.isFinite(amount) ? amount : 0, interval, anchor };
    setRecurring((r) => [...r, item]);
    setWeek((w) => ({ ...w, items: [...w.items, { id, name: item.name, amount: item.amount }] }));
    setNewRecName(""); setNewRecAmount(""); setNewRecInterval("1");
  }
  function updateRecurringItem(id, patch) { setRecurring((r) => r.map((it) => (it.id === id ? { ...it, ...patch } : it))); }
  function removeRecurringItem(id) { setRecurring((r) => r.filter((it) => it.id !== id)); }
  function addRecurringToWeek(item) { addOneOffItem({ name: item.name, amount: item.amount }); }

  function addWishItem() {
    const name = newWishName.trim();
    if (!name) return;
    const amount = parseFloat(newWishAmount);
    setWishlist((w) => [...w, { id: newId(), name, amount: Number.isFinite(amount) ? amount : 0 }]);
    setNewWishName(""); setNewWishAmount("");
  }
  function removeWishItem(id) { setWishlist((w) => w.filter((x) => x.id !== id)); }
  function updateWishItem(id, patch) { setWishlist((w) => w.map((x) => (x.id === id ? { ...x, ...patch } : x))); }
  function addWishToWeek(item) { addOneOffItem({ name: item.name, amount: item.amount }); }

  const isCurrentWeek = toKey(monday) === toKey(getMonday(new Date()));

  return (
    <div className="ledgerRoot">
      <div className="perf" aria-hidden="true">{Array.from({ length: 14 }).map((_, i) => <span key={i} />)}</div>

      <header className="head">
        <div className="eyebrow">HOUSEHOLD LEDGER</div>
        <h1>Weekly Budget</h1>
      </header>

      <nav className="weekbar">
        <button aria-label="Previous week" onClick={() => setMonday((m) => addDays(m, -7))}>‹</button>
        <div className="weeklabel">
          <span className="tab">{formatRange(monday)}</span>
          {!isCurrentWeek && <button className="today" onClick={() => setMonday(getMonday(new Date()))}>Today</button>}
        </div>
        <button aria-label="Next week" onClick={() => setMonday((m) => addDays(m, 7))}>›</button>
      </nav>

      <div className="card">
        <div className="sectionLabel">Income</div>
        {week.incomes.map((inc) => (
          <div className="row income" key={inc.id}>
            <input id={`inc-${inc.id}`} className="name" value={inc.label} placeholder="Paycheck" onChange={(e) => updateIncome(inc.id, { label: e.target.value })} />
            <div className="leader" />
            <AmountInput value={inc.amount} onChange={(v) => updateIncome(inc.id, { amount: v })} />
            {week.incomes.length > 1 && <button className="del" aria-label={`Remove ${inc.label || "income"}`} onClick={() => removeIncome(inc.id)}>×</button>}
          </div>
        ))}
        <button className="add small" onClick={addIncomeRow}>+ Add another paycheck</button>

        <div className="rule" />

        <div className="items">
          {week.items.map((it) => (
            <div className="row item" key={it.id}>
              <input id={`name-${it.id}`} className="name" value={it.name} placeholder="Item" onChange={(e) => updateItem(it.id, { name: e.target.value })} />
              <div className="leader" />
              <AmountInput value={it.amount} onChange={(v) => updateItem(it.id, { amount: v })} />
              <button className="del" aria-label={`Remove ${it.name || "item"}`} onClick={() => removeItem(it.id)}>×</button>
            </div>
          ))}
        </div>

        <button className="add" onClick={() => addOneOffItem()}>+ Add item for this week</button>

        <div className="totals">
          <div className="row total-row"><span>Total income</span><span className="mono">{money(totalIncome)}</span></div>
          <div className="row total-row"><span>Total bills</span><span className="mono">{money(totalBills)}</span></div>
          <div className={"row leftover-row " + (leftover < 0 ? "neg" : "pos")}><span>Leftover</span><span className="mono big">{money(leftover)}</span></div>
        </div>
      </div>

      <div className="toggleBar">
        <button className="manageToggle" onClick={() => setShowRecurring((s) => !s)}>{showRecurring ? "Hide recurring items" : "Recurring items"}</button>
        <button className="manageToggle" onClick={() => setShowWishlist((s) => !s)}>{showWishlist ? "Hide wish list" : "Wish list"}</button>
        <button className="manageToggle" onClick={() => setShowTotals((s) => !s)}>{showTotals ? "Hide totals" : "View totals"}</button>
      </div>

      {showRecurring && (
        <div className="manage">
          <p className="hint">Set how often each bill repeats — every week, every 2 weeks, every 4, whatever fits. It'll auto-fill on weeks where it's due, starting from the week you add it.</p>
          {recurring.map((r) => (
            <div className="recurringCard" key={r.id}>
              <div className="row">
                <input className="name" value={r.name} onChange={(e) => updateRecurringItem(r.id, { name: e.target.value })} />
                <div className="leader" />
                <AmountInput value={r.amount} onChange={(v) => updateRecurringItem(r.id, { amount: v })} />
                <button className="del" onClick={() => removeRecurringItem(r.id)} aria-label={`Remove ${r.name}`}>×</button>
              </div>
              <div className="recurringMeta">
                <span>every</span>
                <input
                  type="number"
                  min="1"
                  className="intervalInput"
                  value={r.interval}
                  onChange={(e) => updateRecurringItem(r.id, { interval: Math.max(1, parseInt(e.target.value, 10) || 1) })}
                />
                <span>week(s)</span>
                <button className="addSmall" onClick={() => addRecurringToWeek(r)}>Add to this week</button>
              </div>
            </div>
          ))}

          <div className="newRecurringBox">
            <div className="row manageRow">
              <input value={newRecName} placeholder="New recurring item…" onChange={(e) => setNewRecName(e.target.value)} />
              <input
                className="wishAmountInput"
                value={newRecAmount}
                placeholder="0.00"
                inputMode="decimal"
                onChange={(e) => { const v = e.target.value; if (/^-?\d*\.?\d{0,2}$/.test(v)) setNewRecAmount(v); }}
              />
            </div>
            <div className="recurringMeta">
              <span>every</span>
              <input type="number" min="1" className="intervalInput" value={newRecInterval} onChange={(e) => setNewRecInterval(e.target.value)} />
              <span>week(s), starting this week</span>
            </div>
            <button className="addSmall" style={{ marginTop: 6 }} onClick={addRecurringItem}>Add recurring item</button>
          </div>
        </div>
      )}

      {showWishlist && (
        <div className="manage">
          <p className="hint">Keep things you're saving up for here, then drop one into any week when you're ready.</p>
          {wishlist.length === 0 && <p className="hint">Nothing on the wish list yet.</p>}
          {wishlist.map((w) => (
            <div className="row wishRow" key={w.id}>
              <input className="name" value={w.name} onChange={(e) => updateWishItem(w.id, { name: e.target.value })} />
              <div className="leader" />
              <AmountInput value={w.amount} onChange={(v) => updateWishItem(w.id, { amount: v })} />
              <button className="addSmall" onClick={() => addWishToWeek(w)}>Add to week</button>
              <button className="del" onClick={() => removeWishItem(w.id)} aria-label={`Remove ${w.name} from wish list`}>×</button>
            </div>
          ))}
          <div className="row manageRow addRow">
            <input value={newWishName} placeholder="Something you want…" onChange={(e) => setNewWishName(e.target.value)} />
            <input
              className="wishAmountInput"
              value={newWishAmount}
              placeholder="0.00"
              inputMode="decimal"
              onChange={(e) => { const v = e.target.value; if (/^-?\d*\.?\d{0,2}$/.test(v)) setNewWishAmount(v); }}
              onKeyDown={(e) => e.key === "Enter" && addWishItem()}
            />
            <button className="addSmall" onClick={addWishItem}>Add</button>
          </div>
        </div>
      )}

      {showTotals && (
        <div className="manage">
          <div className="tabSwitch">
            <button className={totalsTab === "month" ? "active" : ""} onClick={() => setTotalsTab("month")}>Month</button>
            <button className={totalsTab === "year" ? "active" : ""} onClick={() => setTotalsTab("year")}>Year</button>
          </div>
          {totalsTab === "month" ? (
            <>
              <nav className="yearbar">
                <button aria-label="Previous month" onClick={() => setMonthView((d) => new Date(d.getFullYear(), d.getMonth() - 1, 1))}>‹</button>
                <span className="tab yearTab">{monthView.toLocaleDateString("en-US", { month: "long", year: "numeric" })}</span>
                <button aria-label="Next month" onClick={() => setMonthView((d) => new Date(d.getFullYear(), d.getMonth() + 1, 1))}>›</button>
              </nav>
              <Breakdown loading={monthLoading} err={monthError} data={monthData} periodWord="this month" />
            </>
          ) : (
            <>
              <nav className="yearbar">
                <button aria-label="Previous year" onClick={() => setYearView((y) => y - 1)}>‹</button>
                <span className="tab yearTab">{yearView}</span>
                <button aria-label="Next year" onClick={() => setYearView((y) => y + 1)}>›</button>
              </nav>
              <Breakdown loading={yearLoading} err={yearError} data={yearData} periodWord="this year" />
            </>
          )}
        </div>
      )}

      {error && <div className="error">{error}</div>}
      <p className="footerNote">Your numbers are saved on this device only.</p>
    </div>
  );
}

function Breakdown({ loading, err, data, periodWord }) {
  if (loading) return <p className="hint">Adding it all up…</p>;
  if (err) return <p className="hint" style={{ color: "var(--negative)" }}>{err}</p>;
  if (!data) return null;
  if (data.weeks === 0) return <p className="hint">No weeks saved for {periodWord} yet.</p>;
  return (
    <>
      <p className="hint">Based on {data.weeks} week{data.weeks === 1 ? "" : "s"} saved {periodWord}.</p>
      <div className="yearList">
        {data.categories.map((c) => (
          <div className="row yearRow" key={c.name}>
            <span className="name">{c.name}</span>
            <div className="leader" />
            <span className="mono">{money(c.total)}</span>
          </div>
        ))}
      </div>
      <div className="totals">
        <div className="row total-row"><span>Total income</span><span className="mono">{money(data.income)}</span></div>
        <div className="row total-row"><span>Total spent</span><span className="mono">{money(data.spent)}</span></div>
        <div className={"row leftover-row " + (data.leftover < 0 ? "neg" : "pos")}><span>Net</span><span className="mono big">{money(data.leftover)}</span></div>
      </div>
    </>
  );
}

function AmountInput({ id, value, onChange }) {
  const [text, setText] = useState(value === 0 ? "" : String(value));
  useEffect(() => { setText(value === 0 ? "" : String(value)); }, [value]);
  return (
    <input
      id={id}
      className="amount"
      inputMode="decimal"
      placeholder="0.00"
      value={text}
      onChange={(e) => { const v = e.target.value; if (/^-?\d*\.?\d{0,2}$/.test(v)) setText(v); }}
      onBlur={() => { const n = parseFloat(text); onChange(Number.isFinite(n) ? n : 0); }}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<WeeklyLedger />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
